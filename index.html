<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銷售型演說八大要訣</title>
<style>
  :root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --gold: #f5a623;
    --card-bg: #16213e;
    --text: #eaeaea;
    --text-muted: #a0a0b0;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: var(--primary);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
    padding: 24px 20px 20px;
    text-align: center;
    border-bottom: 2px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  header h1 {
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #fff 30%, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  .progress-bar {
    height: 3px;
    background: rgba(255,255,255,0.1);
    margin-top: 14px;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 16px 20px 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: transparent;
    color: var(--text-muted);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-weight: 700;
  }

  .tab:hover:not(.active) {
    border-color: var(--accent);
    color: var(--text);
  }

  main {
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ── Overview ── */
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-top: 8px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.07);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--card-accent, var(--accent));
    border-radius: 4px 0 0 4px;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    border-color: rgba(255,255,255,0.15);
  }

  .card-number {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--card-accent, var(--accent));
    opacity: 0.25;
    position: absolute;
    top: 12px; right: 16px;
    line-height: 1;
  }

  .card-icon {
    font-size: 2rem;
    margin-bottom: 10px;
    display: block;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .card-subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .card-tag {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 0.72rem;
    background: rgba(255,255,255,0.08);
    color: var(--text-muted);
  }

  /* ── Detail ── */
  .detail-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .detail-back {
    background: rgba(255,255,255,0.08);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.2s;
  }
  .detail-back:hover { background: rgba(255,255,255,0.15); }

  .detail-num {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .detail-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 28px;
    border: 1px solid rgba(255,255,255,0.07);
  }

  .detail-icon { font-size: 3rem; display: block; margin-bottom: 12px; }

  .detail-title {
    font-size: clamp(1.2rem, 3vw, 1.5rem);
    font-weight: 800;
    margin-bottom: 16px;
    line-height: 1.3;
  }

  .detail-divider {
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    margin-bottom: 20px;
    border-radius: 2px;
  }

  .detail-body { font-size: 0.95rem; line-height: 1.8; color: #d0d0e0; }

  .detail-body h3 {
    font-size: 1rem;
    color: var(--gold);
    margin: 18px 0 8px;
    font-weight: 700;
  }

  .detail-body ul {
    padding-left: 20px;
  }

  .detail-body li {
    margin-bottom: 8px;
    color: #c8c8d8;
  }

  .detail-body .highlight {
    background: rgba(233,69,96,0.12);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin: 16px 0;
    font-style: italic;
  }

  .detail-body .tip-box {
    background: rgba(245,166,35,0.1);
    border: 1px solid rgba(245,166,35,0.3);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 16px 0;
  }

  .detail-body .tip-box strong { color: var(--gold); }

  .nav-btns {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .nav-btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: transparent;
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .nav-btn:hover { background: rgba(255,255,255,0.08); }
  .nav-btn.primary { background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .nav-btn.primary:hover { background: #d63651; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  /* ── Checklist ── */
  .checklist-intro {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.07);
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .checklist-item {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: border-color 0.2s;
  }

  .checklist-item.done { border-color: rgba(100,220,120,0.3); }

  .check-box {
    width: 24px; height: 24px;
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    margin-top: 1px;
  }

  .checklist-item.done .check-box {
    background: #4caf50;
    border-color: #4caf50;
    color: white;
    font-size: 0.8rem;
  }

  .check-label { font-size: 0.92rem; line-height: 1.5; }
  .check-label strong { display: block; margin-bottom: 3px; }
  .check-label span { color: var(--text-muted); font-size: 0.82rem; }

  .checklist-item.done .check-label strong { text-decoration: line-through; opacity: 0.6; }

  .reset-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: transparent;
    color: var(--text-muted);
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
  }
  .reset-btn:hover { background: rgba(255,255,255,0.06); color: white; }

  /* ── Script ── */
  .script-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.07);
  }

  .script-step {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .script-step:last-child { border-bottom: none; padding-bottom: 0; }

  .step-num {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem;
    font-weight: 800;
    flex-shrink: 0;
  }

  .step-content strong { display: block; font-size: 0.9rem; margin-bottom: 4px; }
  .step-content p { font-size: 0.83rem; color: var(--text-muted); line-height: 1.5; }

  .copy-btn {
    padding: 10px 20px;
    background: var(--gold);
    color: #1a1a2e;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.88rem;
    transition: opacity 0.2s;
  }
  .copy-btn:hover { opacity: 0.85; }

  @media (max-width: 480px) {
    .detail-card { padding: 20px 16px; }
    .overview-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>💼 銷售型演說八大要訣</h1>
  <p>Sales Mastery · 8 Power Secrets</p>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</header>

<div class="tabs" id="tabBar">
  <button class="tab active" onclick="switchTab('overview')">總覽</button>
  <button class="tab" onclick="switchTab('detail')">詳解</button>
  <button class="tab" onclick="switchTab('checklist')">演講清單</button>
  <button class="tab" onclick="switchTab('script')">話術腳本</button>
</div>

<main>

<!-- ── 總覽 ── -->
<div class="view active" id="view-overview">
  <div class="overview-grid" id="overviewGrid"></div>
</div>

<!-- ── 詳解 ── -->
<div class="view" id="view-detail">
  <div class="detail-header">
    <button class="detail-back" onclick="switchTab('overview')">← 返回</button>
    <span class="detail-num" id="detailNum"></span>
  </div>
  <div class="detail-card" id="detailCard"></div>
  <div class="nav-btns">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← 上一個</button>
    <button class="nav-btn primary" id="nextBtn" onclick="navigate(1)">下一個 →</button>
  </div>
</div>

<!-- ── 演講清單 ── -->
<div class="view" id="view-checklist">
  <div class="checklist-intro">
    ✅ 上台前逐一確認，確保每個要訣都已融入您的簡報中。完成後打勾！
  </div>
  <div id="checklistItems"></div>
  <button class="reset-btn" onclick="resetChecklist()">🔄 重置清單</button>
</div>

<!-- ── 話術腳本 ── -->
<div class="view" id="view-script">
  <div class="script-card">
    <h2 style="font-size:1rem;margin-bottom:4px;">🎤 完整演說流程腳本</h2>
    <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:16px;">依序套用八大要訣的開場到成交話術框架</p>
    <div id="scriptSteps"></div>
  </div>
  <button class="copy-btn" onclick="copyScript()">📋 複製完整腳本</button>
</div>

</main>

<script>
const tips = [
  {
    num: 1,
    icon: '❤️',
    title: '成交一切都是為了愛',
    subtitle: '以真誠關懷驅動每一次銷售',
    tag: '心法基礎',
    color: '#e94560',
    body: `
      <p>銷售的最高境界不是技巧，而是<strong>真心為對方好</strong>。當你相信自己的產品能真正幫助客戶，成交就成為一種服務，而非壓力。</p>
      <div class="highlight">「我成交你，是因為我不忍心讓你錯過這個機會。」</div>

    `,
    script: '各位好！今天我站在這裡，不是要賣給你什麼，而是要和你分享一個可能改變你生命的機會……'
  },
  {
    num: 2,
    icon: '💎',
    title: '提供無可取代的價值',
    subtitle: '讓客戶覺得「只有你」才能做到',
    tag: '差異化定位',
    color: '#7c4dff',
    body: `
      <p>在競爭激烈的市場中，唯有<strong>獨特且不可取代的價值</strong>才能讓客戶非你不可。你的差異化決定了你是否被比價。</p>
      <div class="highlight">「市場上有很多選擇，但沒有一個像我們這樣做到……」</div>

    `,
    script: '市面上有很多類似的選擇，但我必須告訴你，我們和其他人最大的不同是……（獨家價值點）'
  },
  {
    num: 3,
    icon: '🎯',
    title: '明確客戶真正要的是什麼',
    subtitle: '挖掘深層需求，不只是表面問題',
    tag: '需求洞察',
    color: '#00bcd4',
    body: `
      <p>客戶說出口的需求，往往不是他們真正想要的。偉大的銷售者能<strong>洞察深層動機</strong>，讓客戶感覺「你完全了解我！」</p>

      <h3>🔑 精準提問技巧</h3>
      <ul>
        <li>「如果這個問題解決了，你最希望得到的結果是？」</li>
        <li>「是什麼讓你今天來到這裡？」</li>
        <li>「這件事對你來說，最重要的是什麼？」</li>

      <div class="tip-box"><strong>💡 實戰提示：</strong> 演說中加入一段「你是否有過這樣的經歷……」讓客戶點頭，他們感覺被理解，成交率大幅提升。</div>

  {

        <li>⏰ 時間損失：每天消耗在錯誤的方法上</li>

    subtitle: '讓客戶覺得「這個價格太划算了」',
    tag: '價值錨定',

let currentTip = 0;
const checks = JSON.parse(localStorage.getItem('salesChecks') || '{}');

function switchTab(tab) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  const tabMap = { overview: 0, detail: 1, checklist: 2, script: 3 };
  document.querySelectorAll('.tab')[tabMap[tab]].classList.add('active');
}

function openTip(index) {
  currentTip = index;
  renderDetail();
  switchTab('detail');
}

function navigate(dir) {
  currentTip = Math.max(0, Math.min(tips.length - 1, currentTip + dir));
  renderDetail();
}

function renderDetail() {
  const t = tips[currentTip];
  document.getElementById('detailNum').textContent = `第 ${t.num} / ${tips.length} 個要訣`;
  document.getElementById('prevBtn').disabled = currentTip === 0;
  document.getElementById('nextBtn').disabled = currentTip === tips.length - 1;
  document.getElementById('detailCard').innerHTML = `
    <span class="detail-icon">${t.icon}</span>
    <div class="detail-title" style="color:${t.color}">${t.num}. ${t.title}</div>
    <div class="detail-divider" style="background:linear-gradient(90deg,${t.color},transparent)"></div>
    <div class="detail-body">${t.body}</div>
  `;
  updateProgress();
}

function renderOverview() {
  document.getElementById('overviewGrid').innerHTML = tips.map(t => `
    <div class="card" style="--card-accent:${t.color}" onclick="openTip(${t.num - 1})">
      <div class="card-number">${t.num}</div>
      <span class="card-icon">${t.icon}</span>
      <div class="card-title">${t.title}</div>
      <div class="card-subtitle">${t.subtitle}</div>
      <span class="card-tag">${t.tag}</span>
    </div>
  `).join('');
}

function renderChecklist() {
  document.getElementById('checklistItems').innerHTML = tips.map(t => `
    <div class="checklist-item ${checks[t.num] ? 'done' : ''}" id="ci-${t.num}">
      <div class="check-box" onclick="toggleCheck(${t.num})">${checks[t.num] ? '✓' : ''}</div>
      <div class="check-label">
        <strong>${t.icon} ${t.num}. ${t.title}</strong>
        <span>${t.subtitle}</span>
      </div>
    </div>
  `).join('');
  updateProgress();
}

function toggleCheck(num) {
  checks[num] = !checks[num];
  localStorage.setItem('salesChecks', JSON.stringify(checks));
  renderChecklist();
}

function resetChecklist() {
  Object.keys(checks).forEach(k => delete checks[k]);
  localStorage.setItem('salesChecks', JSON.stringify(checks));
  renderChecklist();
}

function updateProgress() {
  const done = Object.values(checks).filter(Boolean).length;
  document.getElementById('progressFill').style.width = (done / tips.length * 100) + '%';
}

function renderScript() {
  document.getElementById('scriptSteps').innerHTML = tips.map(t => `
    <div class="script-step">
      <div class="step-num">${t.num}</div>
      <div class="step-content">
        <strong>${t.icon} ${t.title}</strong>
        <p>${t.script}</p>
      </div>
    </div>
  `).join('');
}

function copyScript() {
  const text = tips.map(t => `【${t.num}. ${t.title}】\n${t.script}`).join('\n\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✅ 已複製！';
    setTimeout(() => btn.textContent = '📋 複製完整腳本', 2000);
  });
}

renderOverview();
renderChecklist();
renderScript();
updateProgress();
</script>
